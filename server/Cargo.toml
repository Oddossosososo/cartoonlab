[package]
name = "cartoonlab-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bytes = "1"
kokoro-en = "0.1.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
